# Corridor-oriented configuration template.
# Update the global bounds after the corridor mesh is aligned in Gazebo.

RobotParams:
  type:               kAerialRobot
  size:               [0.3, 0.3, 0.3]
  size_extension_min: [0.0, 0.0, 0.0]
  size_extension:     [0.1, 0.1, 0.1]
  center_offset:      [0.0, 0.0, 0.0]
  relax_ratio:        0.5
  bound_mode:         kExtendedBound
  safety_extension:   [0.5, 1.5, 1.5]

SensorParams:
  sensor_list:      ["OS064", "Cam", "CamExp"]
  OS064:
    type:           kLidar
    max_range:      20
    center_offset:  [0.0, 0.0, 0.0]
    rotations:      [0.0, 0.0, 0.0]
    fov:            [rad(2*pi), rad(90*pi/180)]
    resolution:     [rad(10.0*pi/180), rad(10.0*pi/180)]
    frontier_percentage_threshold: 0.01
  Cam:
    type:           kLidar
    CameraType:     kRotating
    rot_lims:       [rad(-80*pi/180.0), rad(80*pi/180.0)]
    max_range:      2.0
    min_range:      0.25
    center_offset:  [0.0, 0.0, 0.0]
    rotations:      [0.0, 0.0, 0.0]
    fov:            [rad(80*pi/180.0), rad(60*pi/180.0)]
    resolution:     [rad(5.0*pi/180), rad(5.0*pi/180)]
    frontier_percentage_threshold: 0.06
  CamExp:
    type:           kLidar
    CameraType:     kRotating
    rot_lims:       [-1.57, 1.57]
    max_range:      5.0
    min_range:      0.25
    center_offset:  [0.0, 0.0, 0.0]
    rotations:      [0.0, 0.0, 0.0]
    fov:            [rad(84*pi/180.0), rad(64*pi/180.0)]
    resolution:     [rad(7.0*pi/180), rad(7.0*pi/180)]
    frontier_percentage_threshold: 0.06

CameraAnnotationParams:
  sensor_list:      ["Cam"]
  Cam:
    type:           kLidar
    rot_lims:       [-1.55, 1.55]
    max_range:      2.0
    center_offset:  [0.0, 0.0, 0.0]
    rotations:      [0.0, 0.0, 0.0]
    fov:            [rad(84*pi/180.0), rad(64*pi/180.0)]
    resolution:     [rad(2.0*pi/180), rad(2.0*pi/180)]
    frontier_percentage_threshold: 0.01

BoundedSpaceParams:
  Global:
    type:           kCuboid
    # Keep X almost across the full reconstructed map width and align Y with
    # the requested scene bounds for this tuning pass.
    min_val:        [-70.0, -20.0, -2.5]
    max_val:        [70.0, 240.0, 3.5]
  Local:
    type:           kCylinder
    min_val:        [-15.0, -15.0, -1.0]
    max_val:        [15.0, 15.0, 1.0]
    min_extension:  [-85.0, -45.0, -10.0]
    max_extension:  [85.0, 45.0, 10.0]
    radius:         15.0
    radius_extension: 20.0
  LocalSearch:
    type:           kCuboid
    min_val:        [-70.0, -50.0, -1.8]
    max_val:        [70.0, 50.0, 1.8]
  LocalAdaptiveExp:
    type:           kCuboid
    min_val:        [-10.0, -10.0, -0.75]
    max_val:        [10.0, 10.0, 0.75]

NoGainZones:
  g1:
    type:           kCuboid
    min_val:        [-80.0, -200.0, -10.0]
    max_val:        [80.0, -20.0, 10.0]
  g2:
    type:           kCuboid
    min_val:        [-80.0, 240.0, -10.0]
    max_val:        [80.0, 300.0, 10.0]
  g3:
    type:           kCuboid
    min_val:        [-200.0, -20.0, -10.0]
    max_val:        [-70.0, 240.0, 10.0]
  g4:
    type:           kCuboid
    min_val:        [70.0, -20.0, -10.0]
    max_val:        [200.0, 240.0, 10.0]

RandomSamplerParams:
  SamplerForExploration:
    X:
      pdf_type:       kNormalUniform
      sample_mode:    kLocal
      std_val:        7.5
    Y:
      pdf_type:       kNormalUniform
      sample_mode:    kLocal
      std_val:        7.5
    Z:
      pdf_type:       kNormalUniform
      sample_mode:    kLocal
      std_val:        7.5
    Heading:
      pdf_type:       kUniform
      sample_mode:    kManual
      min_val:        rad(-pi)
      max_val:        rad(pi)
    Pitch:
      pdf_type:       kConst
      sample_mode:    kManual
      const_val:      0.0
  SamplerForSearching:
    X:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Y:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Z:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Heading:
      pdf_type:       kUniform
      sample_mode:    kManual
      min_val:        rad(-pi)
      max_val:        rad(pi)
    Pitch:
      pdf_type:       kConst
      sample_mode:    kManual
      const_val:      0.0
  SamplerForAdaptiveExp:
    X:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Y:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Z:
      pdf_type:       kUniform
      sample_mode:    kLocal
    Heading:
      pdf_type:       kUniform
      sample_mode:    kManual
      min_val:        rad(-pi)
      max_val:        rad(pi)
    Pitch:
      pdf_type:       kConst
      sample_mode:    kManual
      const_val:      0.0

PlanningParams:
  # Cognitive map
  type:             kBasicExploration
  exploration_graph_mode:        kGraph
  exploration_graph_update_mode: kBatch
  exploration_sensor_list:      ["OS064"]
  inspection_sensor_list:       ["Cam"]
  v_max:            1.0
  v_homing_max:     0.9
  yaw_rate_max:     0.9
  yaw_tangent_correction: false
  edge_length_min:  0.1
  edge_length_max:  3.0
  edge_overshoot:   0.0
  exploration_vertex_budget:   500
  exploration_edge_budget:     10000
  num_loops_cutoff: 2000
  num_loops_max:    7000
  nearest_range:    3.0
  nearest_range_min: 0.1
  nearest_range_max: 3.0
  use_current_state: true
  topological_anchor_z_offset: 0.2
  use_ray_model_for_volumetric_gain: true
  exp_gain_voxel_size: 0.8
  path_length_penalty: 0.01
  path_direction_penalty: 0.25
  allow_sudden_dir_change: false
  occupied_voxel_gain: 0.0
  free_voxel_gain:  0.0
  unknown_voxel_gain: 60.0
  topological_node_spacing: 1.0
  topological_connection_radius: 3.0
  select_closest_frontier: false


  # Local exploration
  traverse_length_max: 10.0
  traverse_time_max: 5000.0
  path_safety_enhance_enable: true
  augment_free_voxels_time: 3
  free_frustum_before_planning: false
  freespace_cloud_enable: false
  disable_passage_guided_sampling: false
  directional_candidate_batch_size: 2
  passage_axis_sampling_ratio: 0.35
  passage_lateral_sampling_scale: 0.6
  passage_backward_sampling_scale: 0.4
  local_path_smoothing_enable: true
  local_path_smoothing_iterations: 1
  local_path_smoothing_min_segment: 0.25
  leafs_only_for_volumetric_gain: false
  cluster_vertices_for_gain: false
  clustering_radius: 0.5
  path_interpolation_distance: -1.0


  # Global repositioning and homing
  time_budget_limit: 5000
  auto_homing_enable: false
  go_home_if_fully_explored: false
  repositioning_goal_hysteresis_enable: true
  repositioning_goal_hysteresis_ratio: 1.15
  branch_aware_repositioning_enable: true
  branch_region_selection_count: 2
  branch_memory_alpha: 0.25
  branch_frontier_scale_weight: 1.0
  branch_compactness_weight: 1.0
  branch_success_memory_weight: 1.0
  repositioning_time_weight: 1.0
  dead_zone_escape_enable: true
  dead_zone_min_low_gain_iters: 3
  dead_zone_region_radius: 3.0
  dead_zone_turn_radius: 1.0
  dead_zone_turn_step: 0.5


  # Sensor gain model
  nonuniform_ray_cast: false
  ray_cast_step_size_multiplier: 1.0


  # Optional inspection and semantic traversal
  use_camera_gain: false
  annotate_map_with_camera: true
  inspection_planning: false
  keep_leaf_yaw_only: true

  enable_opening_traversal: false
  opening_alignment_z_offset: 0.0
  only_opening_traversal: false

  auto_opening_path_approval: true
  max_opening_height: 20.0

  box_check_method: 0
  line_check_method: 1


  # Topological graph maintenance
  topological_frontiers_only: true


  # Inspection-only parameters
  min_coverage_percentage: 0.9
  inspection_xy_spacing: 1.0
  inspection_z_spacing: 0.5
  inspection_thr_esdf_dist: 0.75
  inspection_target_viewing_range: 1.5
  inspection_graph_vertices: 500
  max_inspection_vertices: 100

  max_surface_distance: 1.5
  limit_vertices_to_surface: false
  min_occ_surface: 0.0

  max_exploration_iterations: 5
  exploration_only: false
  compartment_centers: [0.0, 0.0, 1.5]
  compartment_dimensions:
    type:           kCuboid
    min_val:        [-20.0, -5.0, -2.5]
    max_val:        [20.0, 5.0, 2.5]

  geofence_checking_enable: true

# Global repositioning region model
RepositioningRegionParams:
  type: kPca
  local_pointcloud_range: 50.0
  bounding_box_size_max: 35
